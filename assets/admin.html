<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin · Portfolio Analytics</title>
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
  <header class="page-head">
    <h1>Portfolio · Analytics <small id="meta"></small></h1>
    <div class="controls">
      <select id="range">
        <option value="1">last 1h</option>
        <option value="24" selected>last 24h</option>
        <option value="168">last 7d</option>
        <option value="0">all time</option>
      </select>
      <button id="refresh">refresh</button>
      <label class="auto"><input type="checkbox" id="auto" checked> auto-refresh 15s</label>
      <span id="status"></span>
    </div>
  </header>

  <!-- Overview cards -->
  <section class="grid stats" id="overviewStats"></section>

  <!-- Three-column charts row -->
  <section class="panels">
    <div class="panel">
      <h2>Top CTAs</h2>
      <div id="topCtas" class="bars"></div>
    </div>
    <div class="panel">
      <h2>Section engagement</h2>
      <div id="sectionEng" class="bars"></div>
    </div>
    <div class="panel">
      <h2>Event mix</h2>
      <div id="eventMix" class="bars"></div>
    </div>
  </section>

  <section class="panels">
    <div class="panel">
      <h2>REPL commands</h2>
      <div id="replCmds" class="bars"></div>
    </div>
    <div class="panel">
      <h2>Browsers / devices</h2>
      <div id="devices" class="bars"></div>
    </div>
    <div class="panel">
      <h2>Referrers</h2>
      <div id="referrers" class="bars"></div>
    </div>
  </section>

  <!-- Visitors (unique users by IP) + Locations -->
  <section class="panels two-col">
    <div class="panel">
      <h2>Visitors <small id="visitorSummary"></small></h2>
      <div id="visitorList" class="visitor-list"></div>
    </div>
    <div class="panel">
      <h2>Locations</h2>
      <div id="locations" class="bars"></div>
    </div>
  </section>

  <!-- Contact channel engagement (the contact tiles: email/phone/github/...) -->
  <section class="panels">
    <div class="panel panel-wide">
      <h2>Contact channels <small id="contactSummary"></small></h2>
      <div id="contactGrid" class="contact-grid"></div>
    </div>
  </section>

  <section class="panels two-col">
    <div class="panel">
      <h2>Recent sessions <small id="sessionCount"></small></h2>
      <div id="sessionList" class="session-list"></div>
    </div>
    <div class="panel">
      <h2>Live feed (last 30)</h2>
      <div id="liveFeed" class="live"></div>
    </div>
  </section>

  <!-- Per-session timeline modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Session timeline</h2>
        <button id="modalClose" aria-label="close">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="/assets/admin.js" defer></script>
</body>
</html>
